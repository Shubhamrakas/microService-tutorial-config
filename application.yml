eureka:
 instance:
   prefer-ip-address: true
 client:
   fetch-registry: true
   register-with-eureka: true
   service-url:
     # defaultZone: http://localhost:9090/eureka
     defaultZone: http://localhost:9000/eureka

 microservice:
  PAYMENT-SERVICE:
    endpoints:
      endpoint:
        uri: http://PAYMENT-SERVICE/payment/doPayment
  
  ORDER-SERVICE:
    endpoints:
      endpoint:
        uri: http://ORDER-SERVICE/order/bookOrder/save
